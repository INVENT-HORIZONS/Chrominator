<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chrominator</title>
<link rel="stylesheet" href="sidepanel.css">
</head>
<body>
<header class="head">
  <div class="brand">
    <span class="eye" id="eye" title="Heartbeat"></span>
    <h1>CHROMINATOR</h1>
  </div>
  <div class="board" id="boardInfo">No board connected</div>
</header>

<div class="banner" id="noSerial" hidden>Web Serial isn't available here. Use Chrome or Edge on a desktop computer.</div>

<section class="conn">
  <button id="btnConnect" class="primary">Connect</button>
  <span class="pill" id="linkPill" data-state="stopped">Disconnected</span>
  <span class="rtt" id="rtt"></span>
</section>
<div class="portline"><span id="portName"></span><button id="btnChoose" class="link">Choose a different port…</button></div>

<section class="buses" id="busSection" hidden>
  <div class="sectionhead"><h2>Buses</h2></div>
  <div class="bus" id="busI2c">
    <label class="switch"><input type="checkbox" id="i2cOn" aria-label="Enable I2C"><span></span></label>
    <span class="busname">I²C</span>
    <span class="buspins" id="i2cPins"></span>
    <div class="busopts">
      <label>Clock <select id="i2cClock" disabled>
        <option value="100000" selected>100 kHz</option><option value="400000">400 kHz</option>
      </select></label>
    </div>
  </div>
  <div class="bus" id="busSpi">
    <label class="switch"><input type="checkbox" id="spiOn" aria-label="Enable SPI"><span></span></label>
    <span class="busname">SPI</span>
    <span class="buspins" id="spiPins"></span>
    <div class="busopts">
      <label>Clock <select id="spiClock" disabled>
        <option value="125000">125 kHz</option><option value="250000">250 kHz</option>
        <option value="500000">500 kHz</option><option value="1000000" selected>1 MHz</option>
        <option value="2000000">2 MHz</option><option value="4000000">4 MHz</option>
      </select></label>
      <label>Mode <select id="spiMode" disabled>
        <option value="0" selected>0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option>
      </select></label>
      <label>Order <select id="spiOrder" disabled>
        <option value="msb" selected>MSB first</option><option value="lsb">LSB first</option>
      </select></label>
    </div>
  </div>
  <div class="note small">Turning a bus on hands its pins to the bus; they're greyed out below. Sending and receiving data isn't wired up yet.</div>
</section>

<section class="pins" id="pinsSection" hidden>
  <div class="sectionhead">
    <h2>Pins</h2>
    <button id="btnSafe" title="Set every pin back to a plain input">All pins safe</button>
  </div>
  <div id="pinList" class="pinlist"></div>
</section>

<section class="scope" id="scopeSection" hidden>
  <div class="sectionhead">
    <h2>Scope</h2>
    <div class="scopectl">
      <select id="scopeWindow" title="Time across the screen">
        <option value="1">1 s</option><option value="2">2 s</option><option value="5">5 s</option>
        <option value="10" selected>10 s</option><option value="30">30 s</option>
        <option value="60">60 s</option><option value="120">2 min</option>
      </select>
      <select id="scopeRange" title="Vertical scale">
        <option value="full">0–5 V</option><option value="auto">Auto</option>
      </select>
      <button id="scopeRun">Pause</button>
    </div>
  </div>
  <canvas id="scopeCanvas"></canvas>
  <div class="scopefoot">
    <div id="scopeLegend" class="legend"></div>
    <div class="scopebtns">
      <button id="scopeClear" class="link small">clear</button>
      <button id="scopeSave" class="link small">save CSV</button>
    </div>
  </div>
  <div class="note small" id="scopeRate"></div>
</section>

<section class="burst" id="burstSection" hidden>
  <div class="sectionhead">
    <h2>Burst</h2>
    <div class="scopectl">
      <button id="burstArm" class="primary">Single</button>
      <button id="burstStop" disabled>Stop</button>
    </div>
  </div>
  <div class="burstctl">
    <label>Channel <select id="burstCh"></select></label>
    <label>Rate <select id="burstRate"></select></label>
    <label>Trigger <select id="burstTrig">
      <option value="0">None (now)</option><option value="1" selected>Rising</option><option value="2">Falling</option>
    </select></label>
    <label>Level <input id="burstLevel" type="number" min="0" max="5" step="0.05" value="2.50"> V</label>
    <label>Pre-trigger <select id="burstPre">
      <option value="0">0%</option><option value="10">10%</option><option value="25" selected>25%</option>
      <option value="50">50%</option><option value="75">75%</option><option value="90">90%</option>
    </select></label>
    <label>Timeout <select id="burstTimeout">
      <option value="1000">1 s</option><option value="5000" selected>5 s</option>
      <option value="30000">30 s</option><option value="0">Never</option>
    </select></label>
    <label class="chk"><input type="checkbox" id="burstRepeat"> Repeat</label>
    <label>Scale <select id="burstRange"><option value="full">0–5 V</option><option value="auto">Auto</option></select></label>
  </div>
  <canvas id="burstCanvas"></canvas>
  <div class="scopefoot">
    <div class="note small" id="burstStats"></div>
    <div class="scopebtns"><button id="burstSave" class="link small">save CSV</button></div>
  </div>
  <div class="burststatus" id="burstStatus"></div>
</section>

<details class="diag" id="diag">
  <summary>Diagnostics</summary>
  <dl id="stats"></dl>
</details>

<details class="logbox" id="logBox" open>
  <summary>Event log <button id="btnClearLog" class="link small">clear</button></summary>
  <ol id="log"></ol>
</details>

<template id="pinRow">
  <div class="pin">
    <span class="label"></span>
    <select class="mode" aria-label="Pin mode"></select>
    <div class="ctl"></div>
  </div>
</template>

<script type="module" src="js/ui.js"></script>
</body>
</html>
